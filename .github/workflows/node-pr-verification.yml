name: TT2 pull request Node verification
on:
  push:
    branches: ['fix/**', 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Full unit and regression tests
        run: npm test
      - name: Verify source catalog parity
        run: npm run check:data
